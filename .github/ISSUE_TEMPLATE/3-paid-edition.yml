name: Paid edition interest
description: Tell us you need more assets, more users or support
title: "Paid edition interest"
labels: [paid-edition]
body:
  - type: markdown
    attributes:
      value: "Tell us what your organisation needs. We will contact you when the paid edition is available. Only share what you are comfortable making public; you can also leave the organisation name out."
  - type: dropdown
    id: assets
    attributes:
      label: About how many assets (hosts) do you need to cover?
      options: ["50-200", "200-1,000", "1,000-5,000", "More than 5,000"]
    validations:
      required: true
  - type: dropdown
    id: users
    attributes:
      label: How many people will use PostVAPT?
      options: ["1-3", "4-10", "11-25", "More than 25"]
    validations:
      required: true
  - type: textarea
    id: needs
    attributes:
      label: What matters most to you?
      description: For example PostgreSQL, single sign-on, more compliance frameworks, support, on-site help.
